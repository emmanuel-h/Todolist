version: 2

# The github-actions updater was removed once for failing every run with
# `dependency_file_not_found` — there was no .github/workflows/ for it to read,
# and that updater treats having nothing to do as an error. There is a workflow
# now, so it is back.
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
